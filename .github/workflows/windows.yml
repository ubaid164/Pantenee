name: Windows x64

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_release.py
      - name: Test packaged offline transcription
        shell: pwsh
        env:
          HF_HUB_OFFLINE: '1'
        run: |
          $app = Join-Path $PWD 'dist\Pantenee\Pantenee.exe'
          $fixture = Join-Path $PWD 'tests\fixtures\speech.wav'
          $process = Start-Process $app -ArgumentList "--check-model `"$fixture`"" -PassThru -Wait -WindowStyle Hidden
          exit $process.ExitCode
      - run: python tools/build_release.py --setup-only
      - uses: actions/upload-artifact@v4
        with:
          name: Pantenee-Setup
          path: dist/Pantenee-Setup.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pantenee-Setup
      - name: Publish the tested preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" Pantenee-Setup.zip --verify-tag --prerelease \
            --title "Pantenee $GITHUB_REF_NAME preview" \
            --notes 'Extract Pantenee-Setup.zip on Windows 11 x64. Install 64-bit Python 3.12 with Tkinter and open Run with Python.cmd. Initial dependency setup needs internet. The bundled Whisper model runs offline.'
